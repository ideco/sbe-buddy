name: build

on:
  pull_request:
  push:
    branches: [main]

# The library and the processor target Java 21 and run on every JDK from 21
# up, so the same build runs on the oldest and on the newest JDK: javac,
# annotation processing and Error Prone all move between compiler versions.
jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The release profile adds the sources and javadoc jars, so a javadoc
      # error fails the pull request rather than the release.
      - run: ./mvnw -B -ntp -Prelease verify
