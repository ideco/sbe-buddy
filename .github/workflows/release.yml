name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# A tag vX.Y.Z on main publishes X.Y.Z to Maven Central: the root POM must
# carry that version, the build is the gate CI runs, and the deploy lands in
# a directory that central-publish.sh signs, bundles and uploads.
#
# Secrets: GPG_PRIVATE_KEY (armored), GPG_PASSPHRASE, and a Central Portal
# user token as CENTRAL_TOKEN_USERNAME and CENTRAL_TOKEN_PASSWORD. The
# variable CENTRAL_PUBLISHING_TYPE, AUTOMATIC or USER_MANAGED, says whether a
# validated deployment publishes by itself or waits for the Portal's button;
# unset, it waits.
jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Check the tag
        run: |
          version=${GITHUB_REF_NAME#v}
          pom=$(sed -n 's|^  <version>\(.*\)</version>$|\1|p' pom.xml | head -1)
          if [ "$version" != "$pom" ]; then
            echo "tag $GITHUB_REF_NAME, but the root POM carries $pom" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Import the signing key
        run: gpg --batch --import <<<"$GPG_PRIVATE_KEY"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - run: ./mvnw -B -ntp -Prelease clean deploy
      - run: .github/central-publish.sh target/staging "$VERSION"
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          CENTRAL_PUBLISHING_TYPE: ${{ vars.CENTRAL_PUBLISHING_TYPE }}
